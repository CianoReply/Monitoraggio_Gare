# Pipeline di controllo (T3.6): a ogni PR verso main/develop esegue lint, test, conformita'
# al contratto API e, se presente un Dockerfile, la build dell'immagine.
# STATO: file preparato senza accesso a GitHub; l'esecuzione reale e' DA VERIFICARE.
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Test (pytest, SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Conformita' al contratto API
        run: pytest -m contract -q
      - name: Test end-to-end (TED finto)
        run: pytest -m e2e -q
      - name: Intera suite
        run: pytest

  test-postgres:
    name: Test (pytest, PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar_test
          POSTGRES_DB: radar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar -d radar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Database di prova effimero: il test cpv ricrea e poi cancella le tabelle.
      TEST_POSTGRES_URL: postgresql+psycopg://radar:radar_test@localhost:5432/radar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Test su PostgreSQL
        run: pytest backend/tests/domain -k postgres -rA

  docker-build:
    name: Build immagine Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Il Dockerfile arriva con T0.7: finche' non esiste il job viene saltato.
    if: ${{ hashFiles('Dockerfile') != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t radar-gare-it:ci .
