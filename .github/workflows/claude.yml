# Claude in GitHub Actions (T3.6): scrivendo @claude in una PR o in una issue si chiede una
# revisione o una correzione.
# DA VERIFICARE (senza accesso a GitHub, non provato):
#  - versione e input di anthropics/claude-code-action (qui @v1);
#  - autenticazione disponibile con gli account Pro: secret ANTHROPIC_API_KEY (chiave API) oppure
#    CLAUDE_CODE_OAUTH_TOKEN (token OAuth dell'abbonamento). Va creato in
#    Settings > Secrets and variables > Actions; nessun segreto e' nel repository.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          # DA VERIFICARE: scegliere UNO dei due secret in base all'account disponibile.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
