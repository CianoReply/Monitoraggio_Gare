# Configurazione del modulo domain: soglie, CPV e parole chiave stanno qui, mai nel codice.
# Si usa TOML (tomllib) invece di YAML perche' pyyaml non e' tra le dipendenze concordate (ADR-013).

[filters]
# Importo minimo in euro: sotto la soglia la gara e' scartata; senza importo e' tenuta.
min_value_eur = 50000
# Una gara e' tenuta se almeno un suo CPV inizia con uno di questi prefissi.
cpv_prefixes = ["72", "48", "302", "324", "642"]
# Paesi ammessi per l'ente appaltante: codici ISO a 3 lettere, come li restituisce TED (es. ["ITA"]).
allowed_countries = ["ITA"]
# Tipi di avviso ammessi (confronto esatto, senza maiuscole): sono i bandi di gara della
# codelist eForms "notice-type". Tutti gli altri (can-* esiti, pin-* preinformazioni, ecc.)
# sono scartati. DA VERIFICARE: gli avvisi pre-eForms, che hanno altri codici.
accepted_notice_types = ["cn-standard", "cn-social", "cn-desg"]

[scoring]
# Voto 1-5 da un totale di punti (docs/source/PIANO_BACKEND.md, T2.3). Valori di partenza,
# da tarare con Giuseppe: cambiarli qui non richiede modifiche al codice.
# Una gara con voto >= relevance_threshold (e non scartata dai filtri) ha is_relevant = true.
relevance_threshold = 3
# CPV "core" (prefissi): 722 = sviluppo software, 725 = servizi informatici. Valgono core_cpv_points.
core_cpv_prefixes = ["722", "725"]
core_cpv_points = 2
# Altri CPV IT (prefissi): valgono other_cpv_points, se non c'e' gia' un CPV core.
# Tenere allineata con filters.cpv_prefixes: un CPV che il filtro scarta non dovrebbe dare punti.
it_cpv_prefixes = ["72", "48", "302", "324", "642"]
other_cpv_points = 1

# Parole chiave nel titolo o nella descrizione (senza maiuscole, solo PAROLA INTERA).
# Regole di corrispondenza (da tarare con Giuseppe):
#  - una parola intera non trova i plurali: i plurali si scrivono come varianti nella stessa
#    voce, separate da "|" ("portale|portali"). Le varianti di una voce contano UNA volta sola.
#  - se una parola e' contenuta in una piu' lunga di un'altra voce ("software" dentro
#    "sviluppo software") conta solo la piu' lunga.
# Ogni keyword_words_per_point voci diverse trovate valgono 1 punto, al massimo keyword_max_points.
# Deviazioni dal piano: "AI" e "data" NON sono keyword. "ai" in italiano e' la preposizione
# ("ai sensi dell'art."), "data" e' la parola "data" (di scadenza); si usano "intelligenza
# artificiale", "big data", "data warehouse", "data lake".
keywords = [
    "cloud", "cybersecurity", "sicurezza informatica", "sviluppo applicativo",
    "sviluppo software", "intelligenza artificiale", "machine learning", "big data",
    "data warehouse", "data lake", "business intelligence", "software",
    "applicativo|applicativi", "piattaforma|piattaforme", "conservazione digitale",
    "portale|portali", "app", "datacenter|data center",
]
keyword_words_per_point = 2
keyword_max_points = 2
# Importo (in euro, o senza valuta) >= high_value_eur: high_value_points.
high_value_eur = 1000000
high_value_points = 1
# Scadenza tra deadline_ok_min_days e deadline_ok_max_days (estremi inclusi): deadline_ok_points.
deadline_ok_min_days = 10
deadline_ok_max_days = 60
deadline_ok_points = 1
# Scadenza a meno di deadline_urgent_days giorni (o gia' passata): deadline_urgent_points (negativo).
deadline_urgent_days = 5
deadline_urgent_points = -1
