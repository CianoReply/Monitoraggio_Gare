# Ambiente locale di Radar Gare IT (T0.7): `docker compose up` avvia PostgreSQL e l'API.
# Le variabili si leggono dal file locale .env (non versionato, vedi .env.example); se manca,
# valgono i valori predefiniti di sviluppo scritti qui sotto.
# DA VERIFICARE: non provato (Docker non installato sulla macchina di sviluppo).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar_dev}
      POSTGRES_DB: ${POSTGRES_DB:-radar}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Solo dal proprio computer.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar_dev}@db:5432/${POSTGRES_DB:-radar}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      TED_API_URL: ${TED_API_URL:-}
      TED_CPV_PREFIXES: ${TED_CPV_PREFIXES:-}
      DOCUMENTS_DIR: /data/documents
      # Scheduler del job giornaliero nel processo dell'API (un solo worker, vedi il comando).
      ENABLE_SCHEDULER: "true"
      INGESTION_SCHEDULE: ${INGESTION_SCHEDULE:-}
    volumes:
      - documents:/data/documents
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    # Applica le migrazioni e poi avvia l'API.
    command: >-
      sh -c "alembic -c backend/domain/alembic.ini upgrade head &&
      uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --workers 1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db_data:
  documents:
